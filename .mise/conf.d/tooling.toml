# Generated by xerrion-dev-tooling; rerun with the complete tool selection.

[tasks."check:markdown"]
description = "Check Markdown with mise-managed markdownlint-cli2 and Prettier"
dir = "{{ vars.markdown_dir }}"
run = [
    "markdownlint-cli2 {{ vars.markdown_files }}",
    "prettier --check --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}",
]

[tasks."check:python"]
depends = [
    "lint:python",
    "typecheck:python",
]
description = "Check Python lint, formatting, and types"

[tasks."deps:python"]
description = "Install Python dependencies from uv.lock, including the dev group"
dir = "{{ vars.python_dir }}"
run = "uv sync --locked --group dev"

[tasks."fix:python"]
description = "Apply safe Ruff lint fixes"
dir = "{{ vars.python_dir }}"
run = "ruff check --fix {{ vars.python_files }}"

[tasks."format:markdown"]
description = "Format Markdown with mise-managed Prettier"
dir = "{{ vars.markdown_dir }}"
run = "prettier --write --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}"

[tasks."format:python"]
description = "Format Python with Ruff"
dir = "{{ vars.python_dir }}"
run = "ruff format {{ vars.python_files }}"

[tasks."lint:python"]
description = "Check Python lint and formatting with Ruff"
dir = "{{ vars.python_dir }}"
run = [
    "ruff check {{ vars.python_files }}",
    "ruff format --check {{ vars.python_files }}",
]

[tasks."test:python"]
description = "Run pytest quietly with short failure tracebacks"
dir = "{{ vars.python_dir }}"
run = "uv run pytest -q --tb=short"

[tasks."typecheck:python"]
description = "Check Python types with ty"
dir = "{{ vars.python_dir }}"
run = "ty check --python {{ vars.python_executable | quote }} --python-version {{ vars.python_version | quote }} {{ vars.python_files }}"

[tools]
markdownlint-cli2 = "latest"
node = "26"
prettier = "latest"

[vars]
markdown_dir = "."
markdown_files = "'**/*.md'"
python_dir = "."
python_executable = ".venv/bin/python"
python_version = "3.14"
