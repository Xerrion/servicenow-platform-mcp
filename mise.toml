# Project tool pins and repository-specific tasks. Shared tasks are generated.
[tools]
python = "3.15"
ruff = "0.16.10"
ty = "0.0.86"
uv = "latest"

[vars]
python_files = "."

[tasks.schemas]
description = "Regenerate offline native tool schema fixtures"
run = "uv run python -m tests.generate_tool_schemas"

[tasks.test-integration]
description = "Run live integration tests (non-production instance only)"
run = "uv run pytest -m integration"

[tasks.build]
description = "Build the distribution"
run = "uv build"


# dev-tooling:aggregates:start
# Generated by xerrion-dev-tooling; rerun with the complete tool selection.

[tasks.check]
depends = [
    "check:markdown",
    "check:python",
]
description = "Check lint, formatting, and types for all selected languages"

[tasks.deps]
depends = ["deps:python"]
description = "Sync dependencies for selected projects"

[tasks.format]
depends = [
    "format:markdown",
    "format:python",
]
description = "Format all selected languages"

[tasks.test]
depends = ["test:python"]
description = "Run tests for all selected languages"
# dev-tooling:aggregates:end
