[project]
name = "servicenow-platform-mcp"
version = "3.0.0"
description = "A comprehensive MCP server for ServiceNow - platform introspection, ITSM workflows, CMDB operations, change intelligence, debugging, investigations, and documentation generation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Lasse Nielsen", email = "lasse@xerrion.dk" },
]
keywords = ["servicenow", "mcp", "model-context-protocol", "platform", "itsm", "cmdb", "debugging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "jsonschema>=4.26.0,<5",
    "httpx2>=2.12.0,<3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    # Python 3.15 needs the newer Windows extension wheels.
    "pywin32>=312; sys_platform == 'win32' and python_version >= '3.15'",
    # Older rpds-py releases cannot build on Python 3.15.
    "rpds-py>=2026.9.1; python_version >= '3.15'",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "starlette>=1.7.0",
    "sentry-sdk>=2.72.0",
]

[project.urls]
Homepage = "https://github.com/Xerrion/servicenow-platform-mcp"
Repository = "https://github.com/Xerrion/servicenow-platform-mcp"
Issues = "https://github.com/Xerrion/servicenow-platform-mcp/issues"
Documentation = "https://github.com/Xerrion/servicenow-platform-mcp/wiki"

[project.scripts]
servicenow-platform-mcp = "servicenow_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicenow_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [".venv*", "venv", "ENV"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration' --cov=servicenow_mcp --cov-report=xml --cov-report=term-missing"
markers = [
    "integration: tests that run against a live ServiceNow instance (requires .env.local credentials)",
    "loopback: unit tests allowed to open loopback sockets",
    "real_http: unit tests that use the real httpx2 transport against local fixtures",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
missing-override-decorator = "error"
possibly-missing-attribute = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
unsound-return-statement = "error"
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true
